
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ЭЩКЕРЕ{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
</head>
<body>
    <header class="header">
        <nav class="navigation">
            <a href="{% url 'main:home' %}" class="logo">
                ЭЩКЕРЕ<span>.</span>
            </a>

            <div class="nav-links">
                <a href="{% url 'main:home' %}">Главная</a>

                <div class="dropdown">
                    <a href="{% url 'main:about' %}">О театре ▾</a>
                    <div class="dropdown-content">
                        <a href="{% url 'main:contacts' %}">Контакты</a>
                        <a href="{% url 'main:location' %}">Как нас найти</a>
                    </div>
                </div>

                <a href="{% url 'main:performances' %}">Афиша</a>
                <a href="{% url 'main:tickets' %}" class="nav-button">
                    Билеты
                </a>
            </div>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>© 2026 ЭЩКЕРЕ — Искусство вне ожиданий</p>
        <p>Учебный проект на Django</p>
    </footer>
</body>
</html>
